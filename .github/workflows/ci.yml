name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lengkeng
          POSTGRES_PASSWORD: lengkeng
          POSTGRES_DB: lengkeng
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lengkeng" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://lengkeng:lengkeng@localhost:5432/lengkeng?schema=public
      JWT_SECRET: ci-secret-khong-dung-cho-production-123
      CUSTOMER_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lengkeng/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm --filter @lengkeng/api prisma:deploy
      - run: pnpm --filter @lengkeng/api prisma:seed
      - run: pnpm --filter @lengkeng/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @lengkeng/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report }
