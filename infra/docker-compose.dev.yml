services:
  postgres:
    image: postgres:16-alpine
    container_name: lengkeng-postgres
    environment:
      POSTGRES_USER: lengkeng
      POSTGRES_PASSWORD: lengkeng
      POSTGRES_DB: lengkeng
    ports:
      - '5432:5432'
    volumes:
      - lengkeng_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lengkeng']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lengkeng_pgdata:
